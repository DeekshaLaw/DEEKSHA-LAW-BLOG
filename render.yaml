services:
  - type: web
    name: deeksha-law
    env: node
    buildCommand: npm run install:all && npm run build
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_EXPIRE
        value: 30d
      - key: VITE_API_URL
        value: https://deeksha-law.onrender.com
      - key: VITE_UPLOADS_URL
        value: https://deeksha-law.onrender.com/uploads
    healthCheckPath: /api/health
    autoDeploy: true 