services:
  - type: web
    name: deeksha-law
    env: node
    buildCommand: |
      npm run install:all
      cd client && npm run build
      mkdir -p ../server/public
      cp -r dist/* ../server/public/
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 30d
      - key: VITE_API_URL
        value: https://deeksha-law.onrender.com
    healthCheckPath: /api/health
    autoDeploy: true 