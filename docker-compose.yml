version: '3.8'

services:
  # Backend API server
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./server/uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE=${JWT_EXPIRE}
      - EMAIL_SERVICE=${EMAIL_SERVICE}
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
    networks:
      - deeksha-network

  # Frontend client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${API_URL}
        - VITE_UPLOADS_URL=${UPLOADS_URL}
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    networks:
      - deeksha-network
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf

networks:
  deeksha-network:
    driver: bridge 